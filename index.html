<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바이브 카페 주문서</title>
  <!-- 스타일시트 연결 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 페이지 상단 헤더 영역 -->
  <header>
    <div class="cafe-logo" style="font-size: 3rem;">🐘☕🐘</div>
    <h1>바이브 카페</h1>
    <p>당신의 하루에 바이브를 더하다</p>

    <!-- 탭 메뉴 영역 -->
    <nav class="tab-nav">
      <button type="button" class="tab-btn active" id="tab-order-btn">☕ 주문하기</button>
      <button type="button" class="tab-btn" id="tab-history-btn">
        📋 주문 내역 <span class="badge" id="order-count-badge">0</span>
      </button>
    </nav>
  </header>

  <!-- 주문서 폼 영역 (JS 유효성 검사를 위해 novalidate 추가) -->
  <main>
    <!-- [탭 1] 주문하기 탭 -->
    <section id="tab-order">
      <form id="order-form" novalidate>
      <!-- 1. 이름 입력 -->
      <div class="form-group">
        <label for="customer-name">이름 (필수):</label>
        <input type="text" id="customer-name" name="customerName" required>
      </div>

      <!-- 2. 전화번호 입력 -->
      <div class="form-group">
        <label for="customer-phone">전화번호:</label>
        <input type="tel" id="customer-phone" name="customerPhone">
      </div>

      <!-- 3. 음료 선택 (드롭다운) -->
      <div class="form-group">
        <label for="beverage-select">음료 선택:</label>
        <select id="beverage-select" name="beverage">
          <option value="" data-price="0">-- 음료를 선택하세요 --</option>
          <option value="americano" data-price="3500">아메리카노 (3,500원)</option>
          <option value="caffe-latte" data-price="4000">카페라떼 (4,000원)</option>
          <option value="caffe-mocha" data-price="4500">카페모카 (4,500원)</option>
          <option value="vanilla-latte" data-price="4500">바닐라라떼 (4,500원)</option>
          <option value="green-tea-latte" data-price="4500">녹차라떼 (4,500원)</option>
          <option value="iced-tea" data-price="5000">아이스티 (5,000원)</option>
        </select>
      </div>

      <!-- 4. 사이즈 선택 (라디오 버튼) -->
      <div class="form-group">
        <fieldset>
          <legend>사이즈</legend>
          <div>
            <input type="radio" id="size-s" name="size" value="S" data-price="0">
            <label for="size-s">S (+0원)</label>
          </div>
          <div>
            <input type="radio" id="size-m" name="size" value="M" data-price="500" checked>
            <label for="size-m">M (+500원)</label>
          </div>
          <div>
            <input type="radio" id="size-l" name="size" value="L" data-price="1000">
            <label for="size-l">L (+1,000원)</label>
          </div>
        </fieldset>
      </div>

      <!-- 5. 추가 옵션 선택 (체크박스) -->
      <div class="form-group">
        <fieldset>
          <legend>추가 옵션</legend>
          <div>
            <input type="checkbox" id="option-shot" name="options" value="shot" data-price="500">
            <label for="option-shot">샷 추가 (+500원)</label>
          </div>
          <div>
            <input type="checkbox" id="option-cream" name="options" value="cream" data-price="500">
            <label for="option-cream">크림 추가 (+500원)</label>
          </div>
          <div>
            <input type="checkbox" id="option-syrup" name="options" value="syrup" data-price="300">
            <label for="option-syrup">시럽 추가 (+300원)</label>
          </div>
          <div>
            <input type="checkbox" id="option-decaf" name="options" value="decaf" data-price="0">
            <label for="option-decaf">디카페인 (+0원)</label>
          </div>
        </fieldset>
      </div>

      <!-- 6. 수량 입력 -->
      <div class="form-group">
        <label for="quantity">수량:</label>
        <input type="number" id="quantity" name="quantity" min="1" max="10" value="1">
      </div>

      <!-- 7. 요청사항 입력 -->
      <div class="form-group">
        <label for="requests">요청사항:</label>
        <textarea id="requests" name="requests" rows="4" cols="50"></textarea>
      </div>

      <!-- 8. 예상 금액 표시 영역 -->
      <div id="total-price-area">
        <span>예상 금액: </span><span id="total-price">0원</span>
      </div>

      <!-- 9 & 10. 주문하기 및 다시 작성 버튼 -->
      <div class="button-group">
        <button type="submit" id="submit-btn">주문하기</button>
        <button type="reset" id="reset-btn">다시 작성</button>
      </div>
    </form>

    <!-- 11. 주문 확인 메시지 영역 (초기 상태 숨김) -->
    <div id="order-confirmation" class="hidden"></div>
    </section>

    <!-- [탭 2] 주문 내역 탭 (초기 상태 숨김) -->
    <section id="tab-history" class="hidden">
      <!-- 주문 카드 목록 영역 -->
      <div id="orders-list"></div>

      <!-- 주문 목록 하단 요약 및 전체 삭제 영역 -->
      <div id="orders-summary-area" class="orders-summary hidden">
        <div id="total-orders-price" class="summary-text">총 주문 금액: 0원 (0건)</div>
        <button type="button" id="clear-all-orders-btn" class="clear-btn">내역 모두 지우기</button>
      </div>
    </section>
  </main>

  <!-- Supabase JS v2 라이브러리 CDN (반드시 script.js보다 먼저 로드) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 자바스크립트 연결 -->
  <script src="script.js"></script>
</body>
</html>
